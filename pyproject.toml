[project]
name = "fondaco"
version = "0.0.1"
description = "Data boundary for AI over enterprise data. Data stays home. Plans cross."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlglot>=30.31,<31",
]

[project.optional-dependencies]
# Excel sources for `fondaco discover` only; the boundary never imports it.
excel = ["openpyxl>=3.1,<4"]
# MCP server (`fondaco-mcp`); a separate process that only talks to the boundary's JSON API.
mcp = ["mcp>=2.3,<3"]
# Read-only source adapters, imported only when selected with FONDACO_ADAPTER.
sqlserver = ["pyodbc>=5.2,<6"]
bigquery = ["google-cloud-bigquery>=3.30,<4"]

[project.scripts]
fondaco = "executor.discovery.cli:main"
fondaco-mcp = "api.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "openpyxl>=3.1,<4",  # exercises the optional Excel discovery source in CI
    "mcp>=2.3,<3",  # exercises the MCP server in CI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "boundary", "planner", "executor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]  # S = bandit rules: boundary code is security code

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests

[tool.pytest.ini_options]
testpaths = ["tests"]
