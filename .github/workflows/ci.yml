name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fondaco
          POSTGRES_PASSWORD: fondaco-dev
          POSTGRES_DB: fondaco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fondaco -d fondaco"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FONDACO_TEST_ADMIN_DSN: postgresql://fondaco:fondaco-dev@localhost:5432/fondaco
      FONDACO_TEST_DSN: postgresql://fondaco_ro:fondaco-ro-dev@localhost:5432/fondaco
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip  # --group needs pip >= 25.1
          pip install . --group dev
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test — unit, adversarial, integration, MCP, DuckDB (branch coverage of the security core)
        run: pytest -q --cov=boundary --cov=executor --cov-branch --cov-report=term-missing
      - name: Smoke-test the CLI and the zero-config demo dataset
        run: |
          fondaco --help
          fondaco demo --build-only --data-dir "$RUNNER_TEMP/demo"
          fondaco discover --duckdb "$RUNNER_TEMP/demo/demo.duckdb" --format yaml > /dev/null

  docker:
    # The image is the install story for most readers: build it and run the
    # zero-config demo in it, as docker-compose.demo.yml does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t fondaco:ci .
      - name: Smoke-test the demo in the container
        run: |
          docker run -d --name demo -p 127.0.0.1:8000:8000 fondaco:ci \
            fondaco demo --host 0.0.0.0 --port 8000 --data-dir /data
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          # Unprivileged, and the UI demands a sign-in.
          test "$(docker exec demo id -u)" = 10001
          curl -fsS http://127.0.0.1:8000/login | grep -q 'name="token"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 303
          docker logs demo | grep -q 'approver token'
          docker exec demo fondaco mcp --help > /dev/null
      - name: Container logs
        if: always()
        run: docker logs demo || true
